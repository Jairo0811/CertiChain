name: Apply Enmanuel ITLA cross update

on:
  push:
    branches:
      - docs/enmanuel-itla-cross
    paths:
      - .github/workflows/apply-enmanuel-itla.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/enmanuel-itla-cross
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update README
        run: python .github/scripts/patch-enmanuel-itla.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: add Enmanuel to ITLA-UNAPEC institutional cross"
          git push
