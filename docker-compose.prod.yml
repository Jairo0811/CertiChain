services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in production}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  api:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required in production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:?BLOCKCHAIN_RPC_URL is required in production}
      CERTIFICATE_REGISTRY_ADDRESS: ${CERTIFICATE_REGISTRY_ADDRESS:?CERTIFICATE_REGISTRY_ADDRESS is required in production}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:?BLOCKCHAIN_PRIVATE_KEY is required in production}
      STORAGE_DRIVER: ipfs
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?DOCUMENT_ENCRYPTION_KEY is required in production}
      IPFS_API_URL: ${IPFS_API_URL:?IPFS_API_URL is required in production}
      IPFS_API_TOKEN: ${IPFS_API_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required in production}

  web:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required in production}
