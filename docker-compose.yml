services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certichain}
      POSTGRES_USER: ${POSTGRES_USER:-certichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certichain-local}
    volumes:
      - certichain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certichain} -d ${POSTGRES_DB:-certichain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # The API sits behind the bundled nginx on the private Docker network. Only private
      # addresses are trusted for X-Forwarded-For, so public clients cannot spoof their IP.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PUBLIC_VERIFY_URL: ${PUBLIC_VERIFY_URL:-http://localhost:8080/verify}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@certichain.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:-postgresql://certichain:certichain-local@db:5432/certichain}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      CERTIFICATE_REGISTRY_ADDRESS: ${CERTIFICATE_REGISTRY_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
      IPFS_API_URL: ${IPFS_API_URL:-}
      IPFS_API_TOKEN: ${IPFS_API_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - certichain-data:/app/.data
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty = same origin: nginx proxies /api to the api service.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  certichain-data:
  certichain-postgres:
